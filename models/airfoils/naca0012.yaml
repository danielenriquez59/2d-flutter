# NACA 0012 -- Leishman-Beddoes constants at low Mach number (Ma < 0.3).
#
# Values marked [paper] are from Shao et al. 2011, theory.md §13.
# The paper omits several constants; those are sourced from Leishman & Nguyen
# (AIAA J. 28(5) 1990) and Chantharasenawong (PhD thesis, Imperial 2007) and
# marked accordingly. See theory.md §9 for provenance.

name: NACA0012

# --- [paper] Table, theory.md §13 --------------------------------------
c_n_alpha: 0.108      # per DEGREE (~6.19 /rad, cf. 2*pi = 6.28)
alpha1_deg: 15.25     # static separation break point
S1_deg: 3.0           # attached-branch decay
S2_deg: 2.3           # separated-branch decay
T_p: 1.7              # leading-edge pressure lag
T_f: 3.0              # separation-point lag
T_v: 6.0              # vortex decay
T_vl: 7.0             # vortex convection over chord
T_b: 2.2              # low-Mach onset lag        (Eq. 17, Ref. [14])
C_N1: 1.75            # low-Mach onset threshold  (Eq. 17, Ref. [14])
B1: 1.0               # C_N overshoot magnitude   (Eq. 18)
B2: 0.2               # C_m overshoot magnitude   (Eq. 20)
C_m0: 0.0             # symmetric section

# --- from Chantharasenawong (2007) -------------------------------------
# sigma1 and sigma2 are switch tables (his Tables 2.3, 2.4) keyed on vortex
# time and loading direction; they live in code, not here. The only constant
# they need is the break-angle droop used during unloading (his Eq. 2.54).
delta_alpha1_deg: 2.103   # his Table 2.1 at M=0.30: 0.0367 rad

# --- from Leishman & Nguyen, AIAA J. 28(5) 1990 ------------------------
# Circulatory indicial constants (their p. 839, attributed to Beddoes).
# The non-circulatory constants K_alpha, K_q, K_alphaM, K_qM are Mach-dependent
# functions given by their Eqs. (A2), (A6), (A12) -- not free parameters, so
# they live in aero/attached.py rather than here.
A1: 0.3
A2: 0.7
b1: 0.14
b2: 0.53

# --- from Chantharasenawong (2007) Eqs. 2.7-2.9, Table 2.1 -------------
# His M=0.30 column IS Shao's constant set: C_Nalpha = 6.1879/rad = 0.108/deg,
# alpha_10 = 0.2662 rad = 15.25 deg, S1 = 0.0524 rad = 3.0 deg, T_P = 1.7,
# T_v0 = 6.0, T_vl = 7.0. Direct confirmation of the values above.
eta: 0.97             # chord-force recovery factor
K0: 0.0025            # aerodynamic-centre offset at f = 1
K1: -0.135            # centre-of-pressure travel with separation
K2: 0.04              # break shape near stall
m_exp: 2.0
x_ac: 0.25
